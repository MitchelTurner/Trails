[build]
builder = "nixpacks"
# Nixpacks already runs `npm ci` in the install phase. Do not run it again —
# a second `npm ci` hits EBUSY on /app/node_modules/.cache.
# data:build is local-only (data/raw is gitignored); network.geojson is committed.
buildCommand = "npm run build"

[deploy]
# No --single: this is a prerendered multi-page site, not an SPA. --single rewrites
# every path to index.html, which serves the homepage for /vision, /network/*, and
# every other route, and turns real 404s into soft 200s.
startCommand = "npx serve dist --listen $PORT"
healthcheckPath = "/"
restartPolicyType = "on_failure"
